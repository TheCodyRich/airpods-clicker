name: Release

# Push a tag like v1.0.0 to build the DMG and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app and DMG
        run: ./build.sh --dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/AirPodClicker.dmg \
            --title "AirPod Clicker $GITHUB_REF_NAME" \
            --notes "Download **AirPodClicker.dmg** below, then follow the [install steps](https://github.com/${{ github.repository }}#install). Works on Apple Silicon and Intel Macs running macOS 13 or later."
